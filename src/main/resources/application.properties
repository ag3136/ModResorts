server.port=${PORT:8080}
spring.datasource.url=${AZURE_SQL_JDBC_URL:jdbc:h2:mem:modresorts;DB_CLOSE_DELAY=-1}
spring.datasource.username=${AZURE_SQL_USERNAME:sa}
spring.datasource.password=${AZURE_SQL_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:modresorts}
azure.key-vault.endpoint=${AZURE_KEY_VAULT_ENDPOINT:}
azure.servicebus.connection-string=${AZURE_SERVICE_BUS_CONNECTION_STRING:}
azure.servicebus.queue-name=${AZURE_SERVICE_BUS_QUEUE_NAME:}
